name: Release

on:
  repository_dispatch:
    types: [release-triggered]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version
        id: version
        run: echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

  build-linux:
    name: Build (linux-x86_64)
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          tar -czf tornade-tui-${{ needs.tag.outputs.version }}-linux-x86_64.tar.gz \
            -C target/release tornade-tui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux-x86_64
          path: "tornade-tui-*.tar.gz"

  build-others:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [tag, build-linux]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: tornade-tui
            archive_ext: tar.gz
            platform: macos-universal
          - os: windows-latest
            artifact_name: tornade-tui.exe
            archive_ext: zip
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release

      - name: Build universal binary (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create \
            target/x86_64-apple-darwin/release/tornade-tui \
            target/aarch64-apple-darwin/release/tornade-tui \
            -output target/release/tornade-tui

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          tar -czf tornade-tui-${{ needs.tag.outputs.version }}-${{ matrix.platform }}.tar.gz \
            -C target/release tornade-tui

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path target\release\tornade-tui.exe -DestinationPath "tornade-tui-${{ needs.tag.outputs.version }}-${{ matrix.platform }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: "tornade-tui-*.${{ matrix.archive_ext }}"

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [tag, build-linux, build-others]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.tag.outputs.version }}" \
            --title "tornade-tui ${{ needs.tag.outputs.version }}" \
            --generate-notes \
            artifacts/tornade-tui-*.tar.gz \
            artifacts/tornade-tui-*.zip

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [tag, build-linux, build-others, publish]
    if: failure()
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          VERSION: ${{ github.event.client_payload.version }}
          TAG_RESULT: ${{ needs.tag.result }}
          BUILD_LINUX_RESULT: ${{ needs.build-linux.result }}
          BUILD_OTHERS_RESULT: ${{ needs.build-others.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        with:
          script: |
            const jobs = {
              'Create Release Tag': process.env.TAG_RESULT,
              'Build (linux)': process.env.BUILD_LINUX_RESULT,
              'Build (macos/windows)': process.env.BUILD_OTHERS_RESULT,
              'Publish Release': process.env.PUBLISH_RESULT,
            };
            const failed = Object.entries(jobs)
              .filter(([, r]) => r === 'failure')
              .map(([name]) => name);
            const version = process.env.VERSION;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release ${version} failed: ${failed.join(', ')}`,
              body: [
                '## Release Pipeline Failure',
                '',
                `**Version**: ${version}`,
                `**Failed jobs**: ${failed.join(', ')}`,
                `**Run**: ${runUrl}`,
                '',
                'This release was triggered by the tornade-gui release orchestrator.',
                'Please investigate and coordinate a fix with the tornade-gui maintainer.',
              ].join('\n'),
            });
