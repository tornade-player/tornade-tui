[package]
name = "tornade-tui"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "tornade-tui"
path = "src/main.rs"

[dependencies]
# Terminal UI framework
ratatui = "0.26"
crossterm = "0.27"

# Core library (git dependency — standalone repo)
tornade-core = { git = "https://github.com/tornade-player/tornade-core", tag = "v0.3.0" }

# Standalone dependencies (expanded from workspace)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
