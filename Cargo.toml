[package]
name = "tornade-tui"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "tornade-tui"
path = "src/main.rs"

[dependencies]
# Terminal UI framework (crossterm re-exported by ratatui 0.30 — no separate dep needed)
ratatui = "0.30.0"
ratatui-image = { version = "10.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
image = "~0.25"

# Core library (standalone repo, consumed as a git dependency for CI).
# For local cross-repo iteration, temporarily switch to:
#   tornade-core = { path = "../tornade-core" }
tornade-core = { git = "https://github.com/tornade-player/tornade-core", branch = "main" }

# Standalone dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"

# Media keys (macOS/Windows/Linux) - feature 012
souvlaki = "0.7"

# Async driver for core reqwest-based scrape/artwork calls on a worker thread - feature 012
tokio = { version = "1", features = ["rt", "macros", "time"] }

# HTTP client used to build the core MusicBrainzClient (matches tornade-core) - feature 012
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }

# Direct SQL for library maintenance (:cleanup). Version tracks tornade-core so
# cargo unifies to a single rusqlite and the pooled Connection types match.
rusqlite = "0.32"

# Hidden window for SMTC media controls (souvlaki requires a real HWND on Windows)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
