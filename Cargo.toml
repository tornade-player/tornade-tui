[package]
name = "tornade-tui"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "tornade-tui"
path = "src/main.rs"

[dependencies]
# Terminal UI framework (crossterm re-exported by ratatui 0.30 — no separate dep needed)
ratatui = "0.30.0"
ratatui-image = { version = "10.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
image = "~0.25"

# Core library (git dependency — standalone repo)
tornade-core = { git = "https://github.com/tornade-player/tornade-core", tag = "v0.3.1" }

# Standalone dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
